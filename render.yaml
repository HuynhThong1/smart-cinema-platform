# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: smart-cinema-admin
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.10.0 --activate && pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build:admin:render
    staticPublishPath: ./frontend/dist/apps/smart-admin/browser
    autoDeployTrigger: checksPass
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: smart-cinema-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: KEYCLOAK_URL
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /app-config.json
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  - type: web
    name: smart-cinema-customer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile.customer
    dockerContext: ./frontend
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: smart-cinema-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: smart-cinema-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: smart_cinema
      - key: KEYCLOAK_URL
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: RENDER_EXTERNAL_URL
      - key: OIDC_AUDIENCE
        value: smart-cinema-api
      - key: PUBLIC_URL
        fromService:
          type: web
          name: smart-cinema-customer
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_URL
        fromService:
          type: web
          name: smart-cinema-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: IP_HASH_SECRET
        generateValue: true
      - key: KEYCLOAK_SERVICE_CLIENT
        value: smart-cinema-service
      - key: KEYCLOAK_SERVICE_SECRET
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: KEYCLOAK_SERVICE_SECRET
      - key: SEED_DEVELOPMENT
        value: "true"

  - type: web
    name: smart-cinema-keycloak
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/keycloak/Dockerfile
    dockerContext: ./infra/keycloak
    healthCheckPath: /realms/master
    autoDeployTrigger: checksPass
    envVars:
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HOSTNAME
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: RENDER_EXTERNAL_URL
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_CACHE
        value: local
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        sync: false
      - key: KC_DB_USERNAME
        sync: false
      - key: KC_DB_PASSWORD
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_URL
        fromService:
          type: web
          name: smart-cinema-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: KEYCLOAK_SERVICE_SECRET
        generateValue: true
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: JAVA_OPTS_KC_HEAP
        value: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
