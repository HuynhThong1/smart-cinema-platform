name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check:ui
      - run: pnpm --dir frontend test:unit
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend build
        env:
          NX_DAEMON: 'false'
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: docker compose up -d mongo mongo-init
      - name: Wait for replica set
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          docker compose logs mongo mongo-init
          exit 1
      - run: go vet ./...
        working-directory: backend
      - run: go test -race ./... -count=1
        working-directory: backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
      - run: go build -o bin/api ./cmd/api
        working-directory: backend
      - if: always()
        run: docker compose down -v
  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    concurrency:
      group: render-production
      cancel-in-progress: true
    env:
      RENDER_KEYCLOAK_DEPLOY_HOOK_URL: ${{ secrets.RENDER_KEYCLOAK_DEPLOY_HOOK_URL }}
      RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      RENDER_CUSTOMER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_CUSTOMER_DEPLOY_HOOK_URL }}
      RENDER_ADMIN_DEPLOY_HOOK_URL: ${{ secrets.RENDER_ADMIN_DEPLOY_HOOK_URL }}
    steps:
      - name: Check deploy hook secrets
        shell: bash
        run: |
          missing=0
          for name in \
            RENDER_KEYCLOAK_DEPLOY_HOOK_URL \
            RENDER_API_DEPLOY_HOOK_URL \
            RENDER_CUSTOMER_DEPLOY_HOOK_URL \
            RENDER_ADMIN_DEPLOY_HOOK_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Deploy services whose sources changed
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          # Only redeploy what actually changed. Rebuilding an untouched service
          # buys nothing and costs a cold start, which on the free plan is where
          # a container is most likely to fall over. Note that a deploy hook
          # rebuilds a service from the configuration Render already holds; it
          # does not read render.yaml, so Blueprint edits need a Blueprint sync
          # and are deliberately not mapped to a service here.
          changed=""
          if [[ -n "${PREVIOUS_SHA}" ]] && git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${PREVIOUS_SHA}" "${COMMIT_SHA}")"
            echo "Changed files:"
            echo "${changed}" | sed 's/^/  /'
          else
            echo "No usable previous commit; treating every service as changed."
          fi

          touched() {
            if [[ -z "${changed}" ]]; then
              return 0
            fi
            grep -qE "$1" <<<"${changed}"
          }

          deploy() {
            local service="$1"
            local hook="$2"

            echo "Triggering ${service} for ${COMMIT_SHA}"
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --get \
              --data-urlencode "ref=${COMMIT_SHA}" \
              "${hook}"
            echo
          }

          maybe_deploy() {
            local service="$1"
            local hook="$2"
            local pattern="$3"

            if touched "${pattern}"; then
              deploy "${service}" "${hook}"
            else
              echo "Skipping ${service}: nothing changed under ${pattern}"
            fi
          }

          maybe_deploy "smart-cinema-keycloak" "${RENDER_KEYCLOAK_DEPLOY_HOOK_URL}" '^infra/keycloak/'
          maybe_deploy "smart-cinema-api" "${RENDER_API_DEPLOY_HOOK_URL}" '^backend/'
          maybe_deploy "smart-cinema-customer" "${RENDER_CUSTOMER_DEPLOY_HOOK_URL}" '^frontend/'
          maybe_deploy "smart-cinema-admin" "${RENDER_ADMIN_DEPLOY_HOOK_URL}" '^frontend/'
