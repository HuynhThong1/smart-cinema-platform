name: smart-cinema
services:
  mongo:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ['127.0.0.1:27018:27017']
    volumes: [mongo7-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [mongosh, --host, 'mongo:27017', --quiet, --eval]
    command: ['try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }']
    restart: 'no'
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-development-only}
      KC_HTTP_PORT: 8081
      KC_HOSTNAME: http://localhost:8081
    ports: ['127.0.0.1:8081:8081']
    volumes: ['./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro', 'keycloak-data:/opt/keycloak/data']
volumes:
  mongo7-data:
  keycloak-data:
