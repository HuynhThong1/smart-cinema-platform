# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: smart-cinema-admin
    runtime: static
    buildCommand: corepack prepare pnpm@11.10.0 --activate && corepack pnpm --dir frontend install --frozen-lockfile && corepack pnpm --dir frontend build:admin:render
    staticPublishPath: ./frontend/dist/apps/smart-admin/browser
    # GitHub Actions deploys the exact verified commit through Render deploy hooks.
    autoDeployTrigger: off
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: smart-cinema-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: KEYCLOAK_URL
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /app-config.json
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  - type: web
    name: smart-cinema-customer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile.customer
    dockerContext: ./frontend
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: smart-cinema-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: smart-cinema-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /readyz
    autoDeployTrigger: off
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: smart_cinema
      - key: KEYCLOAK_URL
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: RENDER_EXTERNAL_URL
      - key: OIDC_AUDIENCE
        value: smart-cinema-api
      - key: PUBLIC_URL
        fromService:
          type: web
          name: smart-cinema-customer
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_URL
        fromService:
          type: web
          name: smart-cinema-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: IP_HASH_SECRET
        generateValue: true
      - key: KEYCLOAK_SERVICE_CLIENT
        value: smart-cinema-service
      - key: KEYCLOAK_SERVICE_SECRET
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: KEYCLOAK_SERVICE_SECRET
      - key: SEED_DEVELOPMENT
        value: "true"

  - type: web
    name: smart-cinema-keycloak
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/keycloak/Dockerfile
    dockerContext: ./infra/keycloak
    healthCheckPath: /realms/master
    autoDeployTrigger: off
    envVars:
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HOSTNAME
        fromService:
          type: web
          name: smart-cinema-keycloak
          envVarKey: RENDER_EXTERNAL_URL
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_CACHE
        value: local
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        sync: false
      - key: KC_DB_USERNAME
        sync: false
      - key: KC_DB_PASSWORD
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_URL
        fromService:
          type: web
          name: smart-cinema-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: KEYCLOAK_SERVICE_SECRET
        generateValue: true
      - key: DEMO_USER_PASSWORD
        sync: false
      # Absolute heap sizes, not RAMPercentage. A percentage is applied to whatever
      # memory the JVM detects, so on a host where it does not see the 512MB cap the
      # 20% initial heap alone commits far more than the instance has and the
      # container is OOM-killed before it ever binds a port. Fixed sizes cannot drift
      # with the host. SerialGC replaces kc.sh's G1 (leaner native footprint on a
      # small heap); overriding JAVA_OPTS wholesale is required because appending
      # -XX:+UseSerialGC to the built-in -XX:+UseG1GC aborts the JVM. That also means
      # kc.sh ignores JAVA_OPTS_KC_HEAP, so it is deliberately absent.
      # Measured: boots in ~15s and holds ~350MB under a hard 512MB limit.
      - key: JAVA_OPTS
        value: >-
          -Xms96m -Xmx224m
          -XX:MetaspaceSize=64M -XX:MaxMetaspaceSize=128m
          -XX:ReservedCodeCacheSize=48m -Xss512k
          -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
          -Djava.security.egd=file:/dev/urandom -Dfile.encoding=UTF-8
