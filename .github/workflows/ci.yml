name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend build
        env:
          NX_DAEMON: 'false'
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: docker compose up -d mongo mongo-init
      - name: Wait for replica set
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          docker compose logs mongo mongo-init
          exit 1
      - run: go vet ./...
        working-directory: backend
      - run: go test -race ./... -count=1
        working-directory: backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
      - run: go build -o bin/api ./cmd/api
        working-directory: backend
      - if: always()
        run: docker compose down -v
